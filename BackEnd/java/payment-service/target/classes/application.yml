spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aicafe}
    username: ${DB_USERNAME:aicafe}
    password: ${DB_PASSWORD:aicafe_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: false

  # Disable Flyway - using JPA auto-create instead
  flyway:
    enabled: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:3005}

# Payment Provider Configurations
payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:2VRTB9OR}
    hash-secret: ${VNPAY_HASH_SECRET:BBGHGFKIWOPHGFKEWUIDJWSIJTGVKSJ}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/return}

  momo:
    partner-code: ${MOMO_PARTNER_CODE:MOMO}
    access-key: ${MOMO_ACCESS_KEY:F8BBNECOBGFONKGG}
    secret-key: ${MOMO_SECRET_KEY:GqZPNPDGBMQHPPNMFFQRNGBXODDBAKGC}
    api-url: ${MOMO_API_URL:https://sandbox.momodev.mobi}

  zalopay:
    app-id: ${ZALOPAY_APP_ID:}
    key1: ${ZALOPAY_KEY1:}
    key2: ${ZALOPAY_KEY2:}
    api-url: ${ZALOPAY_API_URL:https://sb-openapi.zalopay.vn/v2/create}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.example.backend: DEBUG
