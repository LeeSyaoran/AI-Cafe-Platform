# Member Service application.yml
spring:
  application:
    name: member-service
  datasource:
    url: jdbc:postgresql://localhost:5432/aicafe
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}