# Notification Service application.yml
spring:
  application:
    name: notification-service
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}