spring:
  application:
    name: notification-service

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aicafe}
    username: ${DB_USERNAME:aicafe}
    password: ${DB_PASSWORD:aicafe_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA Configuration - AUTO CREATE TABLES
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: false

  # Disable Flyway - using JPA auto-create instead
  flyway:
    enabled: false

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@aicafe.vn}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Async Configuration
  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100
      thread-name-prefix: notification-async-

server:
  port: ${SERVER_PORT:3008}

# Notification Configuration
notification:
  email:
    from: ${MAIL_FROM:noreply@aicafe.vn}
    enabled: ${EMAIL_ENABLED:true}

  sms:
    provider: ${SMS_PROVIDER:mock}
    api-key: ${SMS_API_KEY:}
    sender-name: ${SMS_SENDER:AICafe}

  push:
    provider: ${PUSH_PROVIDER:mock}
    fcm-server-key: ${FCM_SERVER_KEY:}
    apns-key: ${APNS_KEY:}

# Logging
logging:
  level:
    root: INFO
    com.example.backend: DEBUG
    org.springframework.mail: INFO
