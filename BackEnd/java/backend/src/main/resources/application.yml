server:
  port: 8080

spring:
  application:
    name: ai-cafe-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/aicafe
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

jwt:
  secret: aicafe-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000  # 24 hours
  refresh-expiration: 604800000  # 7 days

payment:
  vnpay:
    tmn-code: YOUR_TMN_CODE
    hash-secret: YOUR_HASH_SECRET
    api-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: http://localhost:3000/payment/vnpay/callback

  momo:
    partner-code: YOUR_PARTNER_CODE
    access-key: YOUR_ACCESS_KEY
    secret-key: YOUR_SECRET_KEY
    api-url: https://test-payment.momo.vn/v2/gateway/api/create
    return-url: http://localhost:3000/payment/momo/callback

  zalopay:
    app-id: YOUR_APP_ID
    key1: YOUR_KEY1
    key2: YOUR_KEY2
    api-url: https://sb-openapi.zalopay.vn/v2/createorder
    return-url: http://localhost:3000/payment/zalopay/callback

logging:
  level:
    root: INFO
    com.example.backend: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized