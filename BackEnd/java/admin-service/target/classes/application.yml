spring:
  application:
    name: admin-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aicafe}
    username: ${DB_USERNAME:aicafe}
    password: ${DB_PASSWORD:aicafe_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: false

  # Disable Flyway - using JPA auto-create instead
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:3009}

logging:
  level:
    root: INFO
    com.example.backend: DEBUG
