# ================================================
# AI CAFÉ PLATFORM - DOCKER COMPOSE
# ================================================

version: '3.8'

services:
  # ================================================
  # INFRASTRUCTURE
  # ================================================

  postgres:
    image: postgres:16-alpine
    container_name: aicafe-postgres
    environment:
      POSTGRES_DB: aicafe
      POSTGRES_USER: aicafe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aicafe_secret_password_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicafe -d aicafe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aicafe-network

  redis:
    image: redis:7-alpine
    container_name: aicafe-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password_2024}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aicafe-network

  minio:
    image: minio/minio:latest
    container_name: aicafe-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minio_secret_password_2024}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aicafe-network

  # ================================================
  # API GATEWAY
  # ================================================

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: aicafe-api-gateway
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      HOST: 0.0.0.0

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aicafe
      DB_USER: aicafe
      DB_PASSWORD: ${DB_PASSWORD:-aicafe_secret_password_2024}
      DB_SSL: "false"

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password_2024}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_key_change_in_production_2024}
      JWT_EXPIRES_IN: 1h
      REFRESH_TOKEN_EXPIRES_IN: 7d

      # Storage
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_PASSWORD:-minio_secret_password_2024}
      S3_BUCKET: aicafe-uploads

      # AI Services
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}

      # Payment
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}

      # SMS
      ZNS_API_KEY: ${ZNS_API_KEY}
      ZNS_BRAND_NAME: ${ZNS_BRAND_NAME:-AI_CAFE}

      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-noreply@aicafe.vn}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:5173}

      # Rate Limiting
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aicafe-network

  # ================================================
  # AI SERVICE
  # ================================================

  ai-service:
    build:
      context: ../services/ai-service
      dockerfile: Dockerfile
    container_name: aicafe-ai-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      HOST: 0.0.0.0

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aicafe
      DB_USER: aicafe
      DB_PASSWORD: ${DB_PASSWORD:-aicafe_secret_password_2024}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password_2024}

      # AI Providers
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}

      # Internal API Key (for gateway communication)
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal_secret_key_2024}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aicafe-network

  # ================================================
  # USER SERVICE
  # ================================================

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: aicafe-user-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      HOST: 0.0.0.0

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aicafe
      DB_USER: aicafe
      DB_PASSWORD: ${DB_PASSWORD:-aicafe_secret_password_2024}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password_2024}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_key_change_in_production_2024}

      # Internal API Key
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal_secret_key_2024}

      # SMS
      ZNS_API_KEY: ${ZNS_API_KEY}
      ZNS_BRAND_NAME: ${ZNS_BRAND_NAME:-AI_CAFE}

      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aicafe-network

  # ================================================
  # ORDER SERVICE
  # ================================================

  order-service:
    build:
      context: ../services/order-service
      dockerfile: Dockerfile
    container_name: aicafe-order-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      HOST: 0.0.0.0

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aicafe
      DB_USER: aicafe
      DB_PASSWORD: ${DB_PASSWORD:-aicafe_secret_password_2024}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password_2024}

      # Internal API Key
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal_secret_key_2024}

      # Payment
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}

      # Storage
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_PASSWORD:-minio_secret_password_2024}
      S3_BUCKET: aicafe-uploads
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aicafe-network

  # ================================================
  # FRONTEND
  # ================================================

  frontend:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: aicafe-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
      VITE_GA_TRACKING_ID: ${VITE_GA_TRACKING_ID}
    ports:
      - "3001:80"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aicafe-network

  # ================================================
  # BACKOFFICE (Admin Dashboard)
  # ================================================

  backoffice:
    build:
      context: ../apps/backoffice
      dockerfile: Dockerfile
    container_name: aicafe-backoffice
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "3002:80"
    depends_on:
      - api-gateway
    networks:
      - aicafe-network

  # ================================================
  # KDS (Kitchen Display System)
  # ================================================

  kds:
    build:
      context: ../apps/kds
      dockerfile: Dockerfile
    container_name: aicafe-kds
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    ports:
      - "3003:80"
    depends_on:
      - api-gateway
    networks:
      - aicafe-network

  # ================================================
  # MONITORING
  # ================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: aicafe-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - aicafe-network

  grafana:
    image: grafana/grafana:latest
    container_name: aicafe-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3030:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - aicafe-network

  # ================================================
  # NGINX REVERSE PROXY
  # ================================================

  nginx:
    image: nginx:alpine
    container_name: aicafe-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api-gateway
      - frontend
      - backoffice
    networks:
      - aicafe-network

# ================================================
# VOLUMES
# ================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ================================================
# NETWORKS
# ================================================

networks:
  aicafe-network:
    driver: bridge
