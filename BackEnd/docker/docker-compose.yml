# Docker Compose for Local Development
version: '3.8'

services:
  # ============================================
  # DATABASE
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: aicafe-postgres-dev
    environment:
      POSTGRES_DB: aicafe_dev
      POSTGRES_USER: aicafe
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicafe -d aicafe_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # REDIS
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: aicafe-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # KAFKA
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aicafe-zookeeper-dev
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aicafe-kafka-dev
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================
  # BACKEND SERVICES (Hot Reload Mode)
  # ============================================
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile.dev
    container_name: aicafe-user-service-dev
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aicafe_dev
      SPRING_DATASOURCE_USERNAME: aicafe
      SPRING_DATASOURCE_PASSWORD: devpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    volumes:
      - ./services/user-service:/app
      - maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile.dev
    container_name: aicafe-order-service-dev
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aicafe_dev
      SPRING_DATASOURCE_USERNAME: aicafe
      SPRING_DATASOURCE_PASSWORD: devpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      USER_SERVICE_URL: http://user-service:8080
    volumes:
      - ./services/order-service:/app
      - maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_started

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile.dev
    container_name: aicafe-payment-service-dev
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aicafe_dev
      SPRING_DATASOURCE_USERNAME: aicafe
      SPRING_DATASOURCE_PASSWORD: devpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ORDER_SERVICE_URL: http://order-service:8080
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-TEST}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-TEST}
    volumes:
      - ./services/payment-service:/app
      - maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile.dev
    container_name: aicafe-auth-service-dev
    ports:
      - "8084:8080"
    environment:
      GO_ENV: development
      DATABASE_URL: postgres://aicafe:devpassword@postgres:5432/aicafe_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-key-change-in-production
      PORT: 8080
    volumes:
      - ./services/auth-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  credit-service:
    build:
      context: ./services/credit-service
      dockerfile: Dockerfile.dev
    container_name: aicafe-credit-service-dev
    ports:
      - "8085:8080"
    environment:
      GO_ENV: development
      DATABASE_URL: postgres://aicafe:devpassword@postgres:5432/aicafe_dev
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      PORT: 8080
    volumes:
      - ./services/credit-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-gateway:
    build:
      context: ./services/ai-gateway
      dockerfile: Dockerfile.dev
    container_name: aicafe-ai-gateway-dev
    ports:
      - "8086:8080"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://aicafe:devpassword@postgres:5432/aicafe_dev
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      AUTH_SERVICE_URL: http://auth-service:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./services/ai-gateway:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile.dev
    container_name: aicafe-notification-service-dev
    ports:
      - "8087:8080"
    environment:
      GO_ENV: development
      DATABASE_URL: postgres://aicafe:devpassword@postgres:5432/aicafe_dev
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      PORT: 8080
    volumes:
      - ./services/notification-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # FRONTEND (Development with Hot Reload)
  # ============================================
  web-app:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: aicafe-web-dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api-gateway

  admin-dashboard:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile.dev
    container_name: aicafe-admin-dev
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8080
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api-gateway

  # ============================================
  # API GATEWAY
  # ============================================
  api-gateway:
    image: kong:3.4
    container_name: aicafe-api-gateway-dev
    ports:
      - "8000:8000"      # HTTP proxy
      - "8443:8443"      # HTTPS proxy
      - "8001:8001"      # Admin API
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./infrastructure/kong/kong.yml:/kong/kong.yml:ro
    depends_on:
      - user-service
      - order-service
      - payment-service
      - auth-service
      - credit-service
      - ai-gateway

  # ============================================
  # MONITORING
  # ============================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: aicafe-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.1.0
    container_name: aicafe-grafana-dev
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: aicafe-jaeger-dev
    ports:
      - "16686:16686"  # UI
      - "6831:6831/udp"  # Compact thrift
      - "14268:14268"  # Jaeger thrift
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP

  # ============================================
  # LOCALSTACK (AWS S3/SQS/SNS Mock)
  # ============================================
  localstack:
    image: localstack/localstack:2.3
    container_name: aicafe-localstack-dev
    ports:
      - "4566:4566"  # LocalStack
    environment:
      SERVICES: s3,sqs,ses
      DEBUG: 1
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ./infrastructure/localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  # ============================================
  # VOLUMES
  # ============================================
volumes:
  postgres_dev_data:
  redis_dev_data:
  prometheus_data:
  grafana_data:
  maven_cache:
