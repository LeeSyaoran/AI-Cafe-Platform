# ============================================
# AI Café Platform - Frontend + API Gateway
# ============================================
# Run: docker compose up -d --build
# ============================================

services:
  # ==================== INFRASTRUCTURE ====================
  postgres:
    image: postgres:15-alpine
    container_name: aicafe-postgres
    environment:
      POSTGRES_DB: aicafe
      POSTGRES_USER: aicafe
      POSTGRES_PASSWORD: aicafe_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicafe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aicafe-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aicafe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aicafe-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aicafe-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aicafe.vn
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - aicafe-network
    restart: unless-stopped

  # ==================== BACKEND (Go API Gateway) ====================
  api-gateway:
    build: ./BackEnd/go/api-gateway
    container_name: aicafe-api-gateway
    environment:
      PORT: 3000
      DATABASE_URL: postgres://aicafe:aicafe_secret_2024@postgres:5432/aicafe?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: aicafe-super-secret-jwt-key-for-authentication-2024-must-be-long-enough
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aicafe-network
    restart: unless-stopped

  # ==================== FRONTEND (Next.js) ====================
  web:
    build: ./FrontEnd/Web
    container_name: aicafe-web
    environment:
      NEXT_PUBLIC_API_URL: http://api-gateway:3000
      NEXT_PUBLIC_WS_URL: ws://api-gateway:3000
    ports:
      - "3001:3001"
    depends_on:
      - api-gateway
    networks:
      - aicafe-network
    restart: unless-stopped

  # ==================== REVERSE PROXY (Nginx) ====================
  nginx:
    image: nginx:alpine
    container_name: aicafe-nginx
    ports:
      - "80:80"
    volumes:
      - ./Docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api-gateway
      - web
    networks:
      - aicafe-network
    restart: unless-stopped

# ==================== JAVA SERVICES ====================
  user-service:
    build: ./BackEnd/java/user-service
    container_name: aicafe-user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aicafe
      DB_USERNAME: aicafe
      DB_PASSWORD: aicafe_secret_2024
      JWT_SECRET: aicafe_jwt_secret_key_2024_change_in_production
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aicafe-network
    restart: unless-stopped

  payment-service:
