  admin-service:
    build: ./BackEnd/java/admin-service
    container_name: aicafe-admin-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 3009
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aicafe
      DB_USERNAME: aicafe
      DB_PASSWORD: aicafe_secret_2024
    ports:
      - "3009:3009"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aicafe-network
    restart: unless-stopped

  cafe-service:
    build: ./BackEnd/java/cafe-service
    container_name: aicafe-cafe-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 3010
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aicafe
      DB_USERNAME: aicafe
      DB_PASSWORD: aicafe_secret_2024
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aicafe-network
    restart: unless-stopped

# ==================== VOLUMES & NETWORKS ====================
volumes:
  postgres_data:
  redis_data:

networks:
  aicafe-network:
    name: aicafe-network
    driver: bridge
