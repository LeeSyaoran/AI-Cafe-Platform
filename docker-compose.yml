      SERVER_PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aicafe
      DB_USERNAME: aicafe
      DB_PASSWORD: aicafe_secret_2024
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aicafe-network
    restart: unless-stopped

  member-service:
    build: ./BackEnd/java/member-service
    container_name: aicafe-member-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 3006
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aicafe
      DB_USERNAME: aicafe
      DB_PASSWORD: aicafe_secret_2024
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aicafe-network
    restart: unless-stopped

  order-service:
    build: ./BackEnd/java/order-service
    container_name: aicafe-order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 3007
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aicafe
      DB_USERNAME: aicafe
      DB_PASSWORD: aicafe_secret_2024
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aicafe-network
