  notification-service:
    build: ./BackEnd/java/notification-service
    container_name: aicafe-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 3008
      REDIS_HOST: redis
    ports:
      - "3008:3008"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aicafe-network
